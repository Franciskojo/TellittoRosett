<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="roseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="50%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#BE185D" />
    </linearGradient>
    <linearGradient id="heartShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#roseGradient)" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1" />

  <!-- Subtle Top Highlight -->
  <path d="M4 16C4 9.37 9.37 4 16 4H48C54.63 4 60 9.37 60 16V28C48 24 16 24 4 28V16Z" fill="url(#heartShine)" />

  <!-- Maternal Emblem (Mother cradling baby within heart) -->
  <g filter="url(#softGlow)" fill="#FFFFFF">
    <!-- Heart & Mother Flow -->
    <path d="M32 52.5C31.2 52.5 30.5 52.2 29.9 51.7C21.8 45 13 36.8 13 26.8C13 19.4 18.8 14 26 14C28.8 14 31.3 14.9 33.3 16.5C35.2 14.9 37.8 14 40.5 14C47.7 14 53.5 19.4 53.5 26.8C53.5 36.8 44.7 45 36.6 51.7C35.2 52.9 33.6 52.5 32 52.5Z" fill="#FFFFFF" fill-opacity="0.18" />
    
    <!-- White Crisp Solid Heart Base -->
    <path d="M32 50C31.4 50 30.8 49.7 30.3 49.3C23.2 43.3 15.5 36 15.5 27.2C15.5 20.7 20.6 16 26.9 16C29.4 16 31.6 16.8 33.3 18.2C35 16.8 37.2 16 39.7 16C46 16 51.1 20.7 51.1 27.2C51.1 36 43.4 43.3 36.3 49.3C35 50.4 33.4 50 32 50Z" fill="#FFFFFF" />

    <!-- Negative Space Cutout: Mother and Baby Silhouette -->
    <!-- Mother Head -->
    <circle cx="28.5" cy="24" r="3.2" fill="#E11D48" />
    
    <!-- Baby Head -->
    <circle cx="36.5" cy="30" r="2.5" fill="#E11D48" />

    <!-- Mother's Arm Embracing Baby & Flowing Hair -->
    <path d="M26 27.5C24 29 23 31.5 23 34.5C23 38.5 26 41 30.5 42.5C34 43.5 38 41.5 39.5 38.5C40.5 36.5 40 34 38.5 32.5C36 30 32 30.5 29.5 32C28.5 32.5 27 32 26.5 30.5C26 29.5 25.5 28.5 26 27.5Z" fill="#E11D48" />

    <!-- Baby Swaddle & Body -->
    <path d="M35 32C33.5 33 33 35 34 36.5C35 38 37 38.5 38.5 37.5C39.5 36.5 40 35 39.5 33.5C38.5 32 36.5 31.5 35 32Z" fill="#F43F5E" />
  </g>
</svg>
